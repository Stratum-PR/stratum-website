    <!-- Critical Meta Tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Robots meta tag - will be updated by script below if on dev/staging -->
    <meta name="robots" id="robots-meta" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    
    <!-- Block indexing of dev/staging environments - MUST run before any other scripts -->
    <script>
      // Run immediately, before DOM is fully loaded
      (function() {
        'use strict';
        // Check hostname immediately
        var hostname = window.location.hostname;
        var isDev = hostname.includes('dev.stratumpr.com') || 
                   hostname.includes('staging.stratumpr.com') || 
                   hostname.includes('.vercel.app') ||
                   hostname.includes('localhost');
        
        if (isDev) {
          // Function to update robots meta tag
          var updateRobots = function() {
            var robotsMeta = document.getElementById('robots-meta') || 
                            document.querySelector('meta[name="robots"]');
            if (robotsMeta) {
              robotsMeta.setAttribute('content', 'noindex, nofollow');
              console.log('🚫 Dev environment detected - noindex applied');
            } else {
              // Create if doesn't exist
              var meta = document.createElement('meta');
              meta.name = 'robots';
              meta.content = 'noindex, nofollow';
              meta.id = 'robots-meta';
              var head = document.head || document.getElementsByTagName('head')[0];
              head.insertBefore(meta, head.firstChild);
              console.log('🚫 Dev environment detected - noindex meta tag created');
            }
          };
          
          // Update immediately if DOM is ready
          if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', updateRobots);
          } else {
            updateRobots();
          }
          
          // Also update on load (in case script runs early)
          window.addEventListener('load', function() {
            updateRobots();
            // Force canonical to production URL
            var canonical = document.querySelector('link[rel="canonical"]');
            if (canonical) {
              var path = window.location.pathname;
              canonical.setAttribute('href', 'https://www.stratumpr.com' + path);
              console.log('🔗 Canonical forced to production:', 'https://www.stratumpr.com' + path);
            }
          });
        }
      })();
    </script>
    
    <!-- Launch bar: if the visitor closed it in the last 10 minutes, hide it before the prerendered page paints
         (same key and window as src/components/LaunchBar.tsx) -->
    <script>
      try {
        var hiddenAt = Number(localStorage.getItem('launchBarHiddenAt'));
        if (hiddenAt > 0 && Date.now() - hiddenAt < 600000) {
          document.documentElement.style.setProperty('--launch-bar-h', '0px');
          document.documentElement.setAttribute('data-launch-hidden', '');
        }
      } catch (e) {}
    </script>
    <style>html[data-launch-hidden] #launch-bar { visibility: hidden; }</style>

    <script>

        l.setAttribute('imagesrcset', '/img/hero/hero-1-768.webp 768w, /img/hero/hero-1-960.webp 960w, /img/hero/hero-1.webp 1600w');
        l.setAttribute('imagesizes', '(min-width: 1024px) 1100px, 100vw');
        l.href = '/img/hero/hero-1-960.webp';
        document.head.appendChild(l);
      }
    </script>

        animation: shimmer 1.5s infinite;
